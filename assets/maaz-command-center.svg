<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">Maaz Khan — Computer Engineer</title>
<desc id="desc">Animated developer command center for Maaz Khan.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070b"/><stop offset="0.55" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#6ee7ff"/><stop offset="0.5" stop-color="#8b9cff"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1400" height="500" rx="28" fill="url(#bg)"/>
<rect width="1400" height="500" rx="28" fill="url(#grid)"/>
<circle cx="1190" cy="110" r="180" fill="#6ee7ff" opacity=".055">
  <animate attributeName="r" values="150;210;150" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="1190" cy="110" r="120" fill="none" stroke="#6ee7ff" stroke-opacity=".12">
  <animate attributeName="r" values="90;150;90" dur="5s" repeatCount="indefinite"/>
</circle>
<g font-family="monospace">
  <text x="70" y="68" fill="#6ee7ff" font-size="15" letter-spacing="4">MZ//COMMAND_CENTER</text>
  <text x="70" y="125" fill="#f8fafc" font-size="58" font-weight="700">MAAZ KHAN</text>
  <text x="73" y="160" fill="#94a3b8" font-size="18">COMPUTER ENGINEER · BUILDER · AI / FULL-STACK</text>

  <rect x="70" y="205" width="760" height="175" rx="16" fill="#020617" fill-opacity=".72" stroke="#334155"/>
  <circle cx="98" cy="231" r="6" fill="#6ee7ff"/>
  <text x="118" y="237" fill="#64748b" font-size="13">maaz@github:~$</text>
  <text x="118" y="274" fill="#e2e8f0" font-size="20">whoami</text>
  <text x="118" y="307" fill="#6ee7ff" font-size="17">→ building software worth using.</text>
  <text x="118" y="337" fill="#a5b4fc" font-size="17">→ AI · real-time systems · web · mobile</text>
  <text x="118" y="367" fill="#cbd5e1" font-size="17">→ currently building Aerio</text>
  <rect x="118" y="385" width="170" height="2" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="x" values="118;690;118" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(940 245)">
    <circle r="82" fill="none" stroke="#334155" stroke-width="1"/>
    <circle r="116" fill="none" stroke="#334155" stroke-opacity=".55" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="145" fill="none" stroke="#6ee7ff" stroke-opacity=".12" stroke-dasharray="2 16">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="#6ee7ff" filter="url(#glow)">
      <animate attributeName="r" values="7;12;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-155" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="3">BUILD / SHIP / REPEAT</text>
    <text x="0" y="190" text-anchor="middle" fill="#475569" font-size="11">MUMBAI · INDIA</text>
  </g>

  <text x="70" y="445" fill="#475569" font-size="12">SYSTEM STATUS</text>
  <text x="190" y="445" fill="#6ee7ff" font-size="12">● ONLINE</text>
  <text x="310" y="445" fill="#475569" font-size="12">|</text>
  <text x="335" y="445" fill="#94a3b8" font-size="12">LEARNING IN PUBLIC</text>
  <text x="555" y="445" fill="#475569" font-size="12">|</text>
  <text x="580" y="445" fill="#94a3b8" font-size="12">SHIPPING IN PRACTICE</text>
</g>
</svg>
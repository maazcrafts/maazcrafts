<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030507"/><stop offset=".48" stop-color="#090d14"/><stop offset="1" stop-color="#160d22"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#00f0ff"/><stop offset=".5" stop-color="#6d5cff"/><stop offset="1" stop-color="#ff38d1"/></linearGradient>
 <linearGradient id="text"><stop stop-color="#fff"/><stop offset=".5" stop-color="#a5f3fc"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
 <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" opacity=".035"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
 <clipPath id="clip"><rect width="1400" height="620" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1400" height="620" fill="url(#bg)"/>
<rect width="1400" height="620" fill="url(#grid)"/>
<rect width="1400" height="620" fill="url(#scan)"/>
<ellipse cx="1130" cy="210" rx="250" ry="220" fill="#00e5ff" opacity=".055" filter="url(#soft)"/>
<ellipse cx="300" cy="500" rx="330" ry="170" fill="#a855f7" opacity=".045" filter="url(#soft)"/>

<g font-family="monospace">
<text x="55" y="55" fill="#64748b" font-size="12" letter-spacing="4">MZ.001 / PERSONAL_SYSTEM</text>
<text x="1210" y="55" fill="#22d3ee" font-size="11" letter-spacing="2">● LIVE</text>

<text x="52" y="210" fill="url(#text)" font-size="132" font-weight="900" letter-spacing="-10">MAAZ</text>
<text x="58" y="285" fill="#fff" font-size="58" font-weight="800" letter-spacing="10">KHAN</text>
<text x="61" y="325" fill="#64748b" font-size="14" letter-spacing="4">COMPUTER ENGINEER / AI / FULL-STACK / SYSTEMS</text>


  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
 </circle>
 <circle r="68" fill="none" stroke="#f472b6" stroke-opacity=".25" stroke-dasharray="20 8">
  <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
 </circle>
 <circle r="26" fill="#071019" stroke="#22d3ee" stroke-width="2" filter="url(#glow)">
  <animate attributeName="r" values="22;30;22" dur="2.2s" repeatCount="indefinite"/>
 </circle>
 <circle r="7" fill="#fff"/>
 <g font-size="10" letter-spacing="2">
  <text x="-35" y="-174" fill="#64748b">CORE</text>
  <text x="-55" y="178" fill="#64748b">MUMBAI / IN</text>
 </g>

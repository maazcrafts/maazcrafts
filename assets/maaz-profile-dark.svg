<rect x="18" y="18" width="410" height="3" rx="2" fill="#8aa4c8" opacity="0"><animate attributeName="y" values="18;589;18" dur="5.5s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="5.5s" begin="2.6s" repeatCount="indefinite"/></rect>
<g transform="translate(470 42)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<text y="0" fill="#9ca3af" font-size="13">maaz@github:~$ ./profile</text><line y1="24" x2="670" y2="24" stroke="#252a33"/>
<text y="76" fill="#8aa4c8" font-size="15">01</text><text x="38" y="76" fill="#f4f4f0" font-size="15">MAAZ KHAN</text><text x="38" y="104" fill="#9ca3af" font-size="13">Computer Engineering · AI · Software</text>
<text y="154" fill="#8aa4c8" font-size="15">02</text><text x="38" y="154" fill="#f4f4f0" font-size="15">BUILDING</text><text x="38" y="182" fill="#9ca3af" font-size="13">Aerio · AI Research Assistant</text><text x="38" y="205" fill="#9ca3af" font-size="13">real-time apps · web systems · experiments</text>
<text y="255" fill="#8aa4c8" font-size="15">03</text><text x="38" y="255" fill="#f4f4f0" font-size="15">STACK</text><text x="38" y="283" fill="#9ca3af" font-size="13">Python · C++ · JavaScript · React · Node.js</text><text x="38" y="306" fill="#9ca3af" font-size="13">Postgres · Git · Linux · Vercel</text>
<text y="356" fill="#8aa4c8" font-size="15">04</text><text x="38" y="356" fill="#f4f4f0" font-size="15">STATUS</text><circle cx="48" cy="386" r="4" fill="#8aa4c8"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="62" y="391" fill="#9ca3af" font-size="13">open to software / AI opportunities</text>
<line y1="430" x2="670" y2="430" stroke="#252a33"/><text y="470" fill="#9ca3af" font-size="12">$ echo "build · break · learn · ship"</text><text y="502" fill="#f4f4f0" font-size="12">█<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text>
</g><path d="M446 18V592" stroke="#252a33" opacity=".45"/>

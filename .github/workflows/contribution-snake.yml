name: Update Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: maazcrafts
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=f0c94b&color_dots=161b22,2b2110,5a4310,b88900,f0c94b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=f0c94b&color_dots=161b22,2b2110,5a4310,b88900,f0c94b

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Update Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: maazcrafts
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-light
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=f0c94b
      - name: Commit snake
        uses: EndBug/add-and-commit@v9
        with:
          add: "assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg"
          message: "Update contribution snake"

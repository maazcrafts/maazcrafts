name: Slow Profile Animation

on:
  push:
    paths:
      - 'README.md'
      - 'assets/maaz-profile-transition.gif'
      - '.github/workflows/slow-profile-animation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  slow-gif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Slow the profile animation
        run: |
          python - <<'PY'
          from PIL import Image, ImageSequence
          src = "assets/maaz-profile-transition.gif"
          dst = "assets/maaz-profile-transition-slow.gif"
          im = Image.open(src)
          frames = []
          durations = []
          for frame in ImageSequence.Iterator(im):
              frames.append(frame.convert("RGBA").copy())
              original = int(frame.info.get("duration", 100))
              durations.append(max(120, int(original * 2.2)))
          frames[0].save(dst, save_all=True, append_images=frames[1:], duration=durations, loop=im.info.get("loop", 0), disposal=2, optimize=True)
          PY
      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maaz-profile-transition-slow.gif
          git diff --cached --quiet || git commit -m "Add slower profile photo transition"
          git push
